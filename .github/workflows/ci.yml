name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core ;;
            macOS)
              if [ "${{ matrix.python }}" = "3.10" ]; then
                brew install ffmpeg  # plain formula: no drawtext/libass, must degrade honestly
              else
                brew install ffmpeg-full && echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
              fi ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
      - run: pip install -e ".[dev,mcp]"
      - run: ruff check src tests
      - name: FFmpeg filters the Reels workflow relies on
        shell: bash
        run: |
          ffmpeg -hide_banner -version | head -1
          ffmpeg -hide_banner -filters | grep -E " (drawtext|subtitles|sidechaincompress|loudnorm) " || true
      - run: pytest -q -rs

  remotion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - run: npm ci
      - run: npm run typecheck
