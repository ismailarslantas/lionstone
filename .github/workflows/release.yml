name: release

# Push a tag like v1.0.0 → test, build the wheel and sdist, write SHA256SUMS,
# attest build provenance (SLSA, Sigstore) and publish the GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      # dependencies are hash-pinned (regenerate: see .github/requirements/README.md)
      - run: pip install --require-hashes -r .github/requirements/ci.txt
      - run: pip install --no-deps -e .
      - run: ruff check src tests tools integrations
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      id-token: write       # Sigstore signing for the attestation
      attestations: write   # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Version in the tag matches pyproject.toml
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - run: pip install --require-hashes -r .github/requirements/build.txt && python -m build
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$GITHUB_REF_NAME" dist/* --title "Lionstone ${GITHUB_REF_NAME}" \
            --notes-file "$notes" --verify-tag --latest
